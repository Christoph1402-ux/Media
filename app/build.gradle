plugins {
    id 'com.android.application'
}

android {
    namespace 'de.homecloud.player'
    compileSdk 36

    defaultConfig {
        applicationId "de.homecloud.player"
        minSdk 30          // Android 11 und neuer
        targetSdk 36       // Android 16
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST',
                         'META-INF/versions/**', 'META-INF/*.kotlin_module', 'META-INF/MANIFEST.MF',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'commons-net:commons-net:3.11.1'                 // FTP und FTPS
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'             // WebDAV
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'                 // SMB (Windows-Freigaben, NAS)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.slf4j:slf4j-android:1.7.36'
}
